name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    # Job name is the required status check on main; keep it in sync with branch protection.
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2

      - name: Validate marketplace
        run: claude plugin validate --strict .

      - name: Validate plugins
        run: |
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
          done

      - name: Check PR script template syntax
        run: |
          node --check plugins/typescript-dev-workflow/skills/setup-pr-policy/templates/check-pr.mjs
          python3 -m py_compile plugins/python-dev-workflow/skills/setup-python-pr-policy/templates/check_pr.py
