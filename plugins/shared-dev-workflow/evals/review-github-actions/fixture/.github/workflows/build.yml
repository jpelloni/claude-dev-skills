name: Build

on:
  pull_request_target:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print title
        run: echo "${{ github.event.pull_request.title }}"

      - name: Show token
        run: echo "${{ secrets.DEPLOY_TOKEN }}"
