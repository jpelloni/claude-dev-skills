schema_version: "1.1"
name: generate-pytest-tests
description: >
  Eval for generate-pytest-tests. Requires python3-venv. From plugins/python-dev-workflow:
  claude plugin eval . --trust-plugin --scaffold --case generate-pytest-tests
  --no-publish --allow-tools Write Edit "Bash(.venv/bin/pytest *)" "Bash(python *)" "Bash(python3 *)"
tags: [example]
runs: 1
plugins: ["../.."]
context:
  scaffold_script: fixture.sh
